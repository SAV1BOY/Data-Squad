  - id: EXP-004
    name: "In-App Community Prompts"
    hypothesis: "Prompting users to join the community after completing key actions will increase community participation by 20%"
    status: completed
    type: a_b_test
    owner: david-spinks
    primary_metric: community_join_rate
    secondary_metrics:
      - first_post_rate
      - 14_day_community_retention
    start_date: 2026-01-10
    end_date: 2026-02-10
    sample_size: 6000
    result: "Community join rate increased by 25%. First post rate remained flat. Need to explore activation within community separately."
    decision: ship
    learnings: "The prompt timing matters: post-milestone prompts converted 3x better than random prompts."
