experiments:
  - id: EXP-001
    name: "Onboarding Flow Simplification"
    hypothesis: "Reducing onboarding steps from 5 to 3 will increase activation rate by at least 10%"
    status: completed
    type: a_b_test
    owner: sean-ellis
    primary_metric: new_user_activation_rate
    secondary_metrics:
      - 7_day_retention
      - time_to_first_value
    start_date: 2026-01-20
    end_date: 2026-02-20
    sample_size: 12000
    result: "Activation rate increased by 14%. Statistically significant (p < 0.01). Rolled out to 100%."
    decision: ship
    learnings: "Users drop off primarily at step 3 (profile completion). Making it optional removed the largest friction point."

